[project]
name = "ai-lab-rag-rerank"
version = "0.2.2"
description = "Compare RAG retrieval before and after cross-encoder reranking on your own Korean documents (local, keyless, with a deterministic mock mode)."
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
# 조사 단계에서 실제로 돌려 본 버전 그대로 고정한다.
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "sqlite-vec==0.1.9",
    "numpy==2.5.4",
    "httpx==0.28.1",
    # 아래 셋은 실제(real) 모드의 리랭커에서만 import 한다(mock 모드·테스트는 쓰지 않음).
    "onnxruntime==1.32.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
]

[project.scripts]
rag-rerank = "rag_rerank.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_rerank"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
timeout_method = "thread"
markers = ["real: 실제 Ollama·리랭커 모델이 필요한 테스트(없으면 건너뜀, CI 제외)"]
